name: Project G CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  COMPOSE_FILE: docker/compose.yaml

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Show tool versions
        run: |
          python --version
          uv --version

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src tests

      - name: Run unit tests
        run: ./scripts/test-unit.sh

      - name: Run integration tests
        run: ./scripts/test-integration.sh

  docker:
    name: Docker integration
    needs:
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Create CI environment
        run: |
          cp .env.example .env

          python - <<'PY'
          from pathlib import Path

          path = Path(".env")
          lines = path.read_text(encoding="utf-8").splitlines()

          replacements = {
              "APP_ENV": "test",
              "APP_SECRET_KEY": "ci-application-secret-not-for-production",
              "DATABASE_PASSWORD": "ci-database-password-not-for-production",
              "PUBLISHING_ENABLED": "false",
              "LOG_LEVEL": "INFO",
          }

          updated: list[str] = []
          found: set[str] = set()

          for line in lines:
              key, separator, _value = line.partition("=")

              if separator and key in replacements:
                  updated.append(f"{key}={replacements[key]}")
                  found.add(key)
              else:
                  updated.append(line)

          for key, value in replacements.items():
              if key not in found:
                  updated.append(f"{key}={value}")

          path.write_text(
              "\n".join(updated) + "\n",
              encoding="utf-8",
          )
          PY

          grep '^PUBLISHING_ENABLED=false$' .env

      - name: Validate Docker Compose configuration
        run: |
          docker compose \
            --env-file .env \
            -f "${COMPOSE_FILE}" \
            config --quiet

      - name: Build application image
        run: |
          docker compose \
            --env-file .env \
            -f "${COMPOSE_FILE}" \
            build

      - name: Start Docker Compose environment
        run: |
          docker compose \
            --env-file .env \
            -f "${COMPOSE_FILE}" \
            up -d

      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 30); do
            echo "Readiness attempt ${attempt}/30"

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8000/api/v1/health/readiness \
              > /tmp/project-g-readiness.json
            then
              cat /tmp/project-g-readiness.json
              exit 0
            fi

            docker compose \
              --env-file .env \
              -f "${COMPOSE_FILE}" \
              ps --all

            sleep 5
          done

          echo "Project G did not become ready"
          exit 1

      - name: Verify running services
        run: |
          running_services="$(
            docker compose \
              --env-file .env \
              -f "${COMPOSE_FILE}" \
              ps --status running --services
          )"

          printf '%s\n' "${running_services}"

          for service in api db queue worker scheduler; do
            if ! grep -qx "${service}" <<< "${running_services}"; then
              echo "Required service is not running: ${service}"
              exit 1
            fi
          done

      - name: Verify Migration exit status
        run: |
          container_id="$(
            docker compose \
              --env-file .env \
              -f "${COMPOSE_FILE}" \
              ps --all -q migrate
          )"

          if [[ -z "${container_id}" ]]; then
            echo "Migration container was not found"
            exit 1
          fi

          exit_code="$(
            docker inspect \
              --format '{{.State.ExitCode}}' \
              "${container_id}"
          )"

          echo "Migration exit code: ${exit_code}"
          test "${exit_code}" = "0"

      - name: Verify Alembic revision
        run: |
          revision="$(
            docker compose \
              --env-file .env \
              -f "${COMPOSE_FILE}" \
              exec -T db \
              sh -c \
              'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT version_num FROM alembic_version;"'
          )"

          normalized_revision="$(
            printf '%s' "${revision}" | tr -d '[:space:]'
          )"

          echo "Alembic revision: ${normalized_revision}"
          test "${normalized_revision}" = "0005_news_article_metadata"

      - name: Run Docker smoke tests
        run: ./scripts/test-docker.sh

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          mkdir -p artifacts/docker

          docker compose \
            --env-file .env \
            -f "${COMPOSE_FILE}" \
            ps --all \
            > artifacts/docker/compose-ps.txt 2>&1 || true

          docker compose \
            --env-file .env \
            -f "${COMPOSE_FILE}" \
            logs --no-color \
            > artifacts/docker/compose-logs.txt 2>&1 || true

          docker inspect \
            "$(docker compose \
              --env-file .env \
              -f "${COMPOSE_FILE}" \
              ps --all -q migrate)" \
            > artifacts/docker/migrate-inspect.json 2>&1 || true

      - name: Upload Docker diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-diagnostics-${{ github.run_id }}
          path: artifacts/docker
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Docker Compose environment
        if: always()
        run: |
          docker compose \
            --env-file .env \
            -f "${COMPOSE_FILE}" \
            down \
            --volumes \
            --remove-orphans
